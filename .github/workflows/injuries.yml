name: Refresh injuries

on:
  schedule:
    # Every two hours. Statuses move daily (Wed practice reports, Fri game
    # designations, weekend upgrades); the stats scrape only needs Tue/Wed/Sat.
    # GitHub's scheduler can run 1-2h late under load, so treat this as
    # "roughly every two hours", not a guarantee before kickoff.
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: injuries
  cancel-in-progress: false

jobs:
  injuries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh injury snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FTN_SEASON: "2026"
        run: python scrape_injuries.py
